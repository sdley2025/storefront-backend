spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: ${APP_NAME:spring-boot-starter-0}
  jwt:
    secret: ${JWT_SECRET:your-strong-random-secret-here}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900} # 15m
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800} # 7d
  profiles:
    active:
      - ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
server:
  port: ${PORT:8080}
stripe:
    secret-key: ${STRIPE_SECRET_KEY:your-stripe-api-key-here}
    webhook-secret-key: ${STRIPE_WEBHOOK_SECRET_KEY:your-stripe-webhook-secret-here}
websiteUrl: ${WEBSITE_URL:http://localhost:4200}
app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
